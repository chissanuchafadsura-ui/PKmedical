<script>
function openIPDRecord(hn) {
  if (currentUser.systemLocation === 'Teacher') {
    alert("สถานะ Teacher ไม่สามารถกดเข้าดูรายละเอียดการรักษาได้");
    return;
  }
  // นำไปสู่หน้าฟอร์มที่คล้ายกับ OPD (แต่ดึงข้อมูลจาก IPD Sheet)
  alert("เปิดฟอร์มรักษา IPD สำหรับ HN: " + hn);
  // สามารถใช้การซ่อน/แสดง div ฟอร์ม IPD ในหน้านี้ได้ตามหลักการเดียวกับหน้า OPD
}
</script>
