<div id="page-login" class="page-section active-page">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card p-4">
        <h4 class="text-center mb-4 text-primary"><i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ</h4>
        <div class="mb-3">
          <label class="fw-bold text-secondary">USERNAME</label>
          <input type="text" id="loginUser" class="form-control form-control-lg" placeholder="กรอกชื่อผู้ใช้งาน">
        </div>
        <div class="mb-4">
          <label class="fw-bold text-secondary">PASSWORD</label>
          <input type="password" id="loginPass" class="form-control form-control-lg" placeholder="กรอกรหัสผ่าน">
        </div>
        <button class="btn btn-primary w-100 btn-lg" onclick="doLogin()">LOGIN</button>
        <div id="loginAlert" class="mt-3 text-danger text-center fw-bold"></div>
      </div>
    </div>
  </div>
</div>

<script>
function doLogin() {
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginAlert').innerText = "กำลังตรวจสอบ...";
  
  google.script.run.withSuccessHandler(res => {
    if(res.status === 'success') {
      currentUser = res;
      document.getElementById('navUserInfo').innerHTML = `<i class="bi bi-person-circle"></i> ${res.name} (${res.medicalPosition})`;
      document.getElementById('mainNav').style.display = 'flex';
      document.getElementById('logos').style.display = 'none';
      setupHomeMenu();
      showPage('page-home');
    } else {
      document.getElementById('loginAlert').innerText = res.message;
    }
  }).checkLogin(user, pass);
}
</script>
