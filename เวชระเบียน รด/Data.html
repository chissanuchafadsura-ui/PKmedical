<div id="page-data" class="page-section">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="text-primary"><i class="bi bi-folder2-open"></i> จัดการฐานข้อมูลผู้ป่วย (Data)</h4>
    <button class="btn btn-secondary btn-sm" onclick="showPage('page-home')">กลับหน้าหลัก</button>
  </div>
  
  <div class="card p-4">
    <h5 class="text-secondary border-bottom pb-2">Patient Information</h5>
    <div class="row mt-3">
      <div class="col-md-3">
        <label>1. Upload Photo Patient</label>
        <input type="file" id="data_pic" class="form-control" accept="image/*">
      </div>
      <div class="col-md-3">
        <label>2. Upload Photo Fingerprint</label>
        <input type="file" id="data_finger" class="form-control" accept="image/*">
      </div>
      <div class="col-md-3">
        <label>3. HN (รันอัตโนมัติ)</label>
        <input type="text" id="data_hn" class="form-control" placeholder="000000" disabled>
      </div>
      <div class="col-md-3">
        <label>4. Student Number</label>
        <input type="text" id="data_stdnum" class="form-control" maxlength="5">
      </div>

      <div class="col-md-3 mt-3"><label>5. National ID</label><input type="text" class="form-control" maxlength="13"></div>
      <div class="col-md-3 mt-3"><label>6. Name - Surname</label><input type="text" class="form-control"></div>
      <div class="col-md-3 mt-3"><label>7. School</label><input type="text" class="form-control"></div>
      <div class="col-md-3 mt-3">
        <label>8. Position</label>
        <select class="form-select" id="data_position" onchange="toggleMilitary()">
          <option>นักเรียน</option><option>ครู</option><option>นักศึกษาวิชาทหาร</option>
        </select>
      </div>

      <div class="col-md-3 mt-3"><label>9. Class</label><input type="text" class="form-control" placeholder="เช่น ม.1/1"></div>
      
      <!-- หมวดนักศึกษาวิชาทหาร (ซ่อนตามเงื่อนไข) -->
      <div class="col-md-9 mt-3" id="military_section" style="display:none;">
        <div class="row">
          <div class="col-md-4"><label>10.1 Company</label><input type="number" class="form-control"></div>
          <div class="col-md-4"><label>10.2 Platoon</label><input type="number" class="form-control"></div>
          <div class="col-md-4"><label>10.3 Squad</label><input type="number" class="form-control"></div>
        </div>
      </div>

      <div class="col-md-3 mt-3">
        <label>11. Gender</label>
        <select class="form-select"><option>ชาย</option><option>หญิง</option></select>
      </div>
      <div class="col-md-3 mt-3">
        <label>12. Birthday</label>
        <input type="date" class="form-control" id="data_dob" onchange="calcAge()">
      </div>
      <div class="col-md-6 mt-3">
        <label>13. Age (คำนวณอัตโนมัติ)</label>
        <div class="input-group">
          <input type="text" class="form-control" id="age_y" disabled placeholder="ปี">
          <input type="text" class="form-control" id="age_m" disabled placeholder="เดือน">
          <input type="text" class="form-control" id="age_d" disabled placeholder="วัน">
        </div>
      </div>
    </div>
    
    <div class="mt-4 text-end">
      <button class="btn btn-primary"><i class="bi bi-save"></i> บันทึกประวัติ</button>
    </div>
  </div>
</div>

<script>
function toggleMilitary() {
  const pos = document.getElementById('data_position').value;
  document.getElementById('military_section').style.display = pos === 'นักศึกษาวิชาทหาร' ? 'block' : 'none';
}

function calcAge() {
  const dob = new Date(document.getElementById('data_dob').value);
  if(isNaN(dob)) return;
  const now = new Date();
  
  let years = now.getFullYear() - dob.getFullYear();
  let months = now.getMonth() - dob.getMonth();
  let days = now.getDate() - dob.getDate();
  
  if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (months < 0) { years--; months += 12; }
  
  document.getElementById('age_y').value = years + " ปี";
  document.getElementById('age_m').value = months + " เดือน";
  document.getElementById('age_d').value = days + " วัน";
}
</script>
