<div id="page-home" class="page-section">
  <div class="row mt-4" id="homeButtons">
    <!-- เมนูต่างๆ จะถูกสร้างขึ้นที่นี่ตามสิทธิ์ -->
  </div>
</div>

<script>
function setupHomeMenu() {
  const menu = document.getElementById('homeButtons');
  menu.innerHTML = '';
  
  let btns = [];
  // ตรวจสอบสิทธิ์ (System location)
  if(currentUser.systemLocation === 'Admin') {
    btns = [
      { id: 'admin', icon: 'bi-person-badge', title: 'Admin' },
      { id: 'data', icon: 'bi-folder2-open', title: 'Data' },
      { id: 'chemical', icon: 'bi-capsule', title: 'Chemical' },
      { id: 'opd', icon: 'bi-clipboard-pulse', title: 'OPD' },
      { id: 'ipd', icon: 'bi-hospital', title: 'IPD' }
    ];
  } else if(currentUser.systemLocation === 'Doctor') {
    btns = [
      { id: 'opd', icon: 'bi-clipboard-pulse', title: 'OPD' },
      { id: 'ipd', icon: 'bi-hospital', title: 'IPD' }
    ];
  } else if(currentUser.systemLocation === 'Teacher') {
    btns = [
      { id: 'ipd', icon: 'bi-hospital', title: 'IPD' }
    ];
  }

  btns.forEach(btn => {
    menu.innerHTML += `
      <div class="col-md-4 col-lg-3 mb-4">
        <button class="btn btn-outline-primary w-100 py-5 fs-3 fw-bold shadow-sm rounded-4" 
                onclick="showPage('page-${btn.id}')">
          <i class="bi ${btn.icon} d-block fs-1 mb-2"></i>
          ${btn.title}
        </button>
      </div>
    `;
  });
}
</script>
