<div id="page-admin" class="page-section">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="text-primary"><i class="bi bi-person-badge"></i> การจัดการผู้ดูแลระบบ (Admin)</h4>
    <button class="btn btn-secondary btn-sm" onclick="showPage('page-home')">กลับหน้าหลัก</button>
  </div>
  
  <div class="card p-4">
    <h5>เพิ่ม / แก้ไข ข้อมูลเจ้าหน้าที่</h5>
    <div class="row mt-3">
      <div class="col-md-3">
        <label>Username</label>
        <input type="text" id="adm_user" class="form-control">
      </div>
      <div class="col-md-3">
        <label>Password</label>
        <input type="text" id="adm_pass" class="form-control">
      </div>
      <div class="col-md-6">
        <label>Name - Surname</label>
        <input type="text" id="adm_name" class="form-control">
      </div>
      <div class="col-md-4 mt-3">
        <label>System location</label>
        <select id="adm_loc" class="form-select">
          <option>Admin</option>
          <option>Doctor</option>
          <option>Teacher</option>
        </select>
      </div>
      <div class="col-md-4 mt-3">
        <label>Medical position</label>
        <select id="adm_pos" class="form-select">
          <option>Student Doctor</option>
          <option>Teacher Doctor</option>
          <option>GP</option>
          <option>Extern</option>
          <option>Intern</option>
          <option>Resident</option>
          <option>Fellowship</option>
          <option>STAFF</option>
        </select>
      </div>
      <div class="col-md-4 mt-3 d-flex align-items-end">
        <button class="btn btn-success w-100"><i class="bi bi-save"></i> บันทึกข้อมูล</button>
      </div>
    </div>
  </div>
</div>
